services:
  mysql:
    image: mysql:8.4
    container_name: neps-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: neps_dev_password
      MYSQL_DATABASE: neps_environment
      TZ: Asia/Shanghai
    ports:
      - "3307:3306"
    volumes:
      - neps_mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-pneps_dev_password"]
      interval: 5s
      timeout: 3s
      retries: 20

  ollama:
    image: ollama/ollama:latest
    container_name: neps-ollama
    profiles: ["ai"]
    restart: unless-stopped
    ports:
      - "11434:11434"
    volumes:
      - neps_ollama_data:/root/.ollama

volumes:
  neps_mysql_data:
  neps_ollama_data:
